{% extends "base.html" %}
{% block content %}
<h1>Claimed pods</h1>
{% if not claims %}
  <p>No one has claimed a pod yet.</p>
{% else %}
  <table class="verkopen">
    <thead><tr><th></th><th>Pod</th><th>Category</th><th>Claimed by</th><th>When</th></tr></thead>
    <tbody>
      {% for c in claims %}
        <tr>
          <td><img class="thumb" src="{{ url_for('static', filename='pods/' ~ c['image_bestand']) }}" alt=""></td>
          <td>{{ c['pod_naam'] }}</td>
          <td>{{ c['categorie'] }}</td>
          <td>{{ c['bezoeker_naam'] }}</td>
          <td>{{ c['tijdstip'] }}</td>
        </tr>
      {% endfor %}
    </tbody>
  </table>
{% endif %}
{% endblock %}
