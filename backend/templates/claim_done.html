{% extends "base.html" %}
{% block content %}
<div class="bevestiging">
  <h1>You're in, {{ naam }}! 🎉</h1>
  <img src="{{ url_for('static', filename='pods/' ~ pod['image_bestand']) }}" alt="{{ pod['naam'] }}">
  <p>You claimed <strong>{{ pod['naam'] }}</strong> ({{ pod['categorie'] }}).</p>
  <a class="btn" href="{{ url_for('shop') }}">Back to the giveaway</a>
</div>
{% endblock %}
